# Build + package the td-deploy Studio desktop app for macOS (.dmg) and Windows
# (.exe). Runs on a manual dispatch (installers uploaded as downloadable
# artifacts) and on a release (installers also attached to the release).
#
# Each OS job pulls its cross-toolchain bundle from build-toolchain, freezes the
# Python sidecar with PyInstaller, then runs electron-builder. BASE_IMAGE_TAG is
# stamped so a fresh install's "Flash SD" pulls the matching base image.
name: build-app

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  toolchain:
    uses: ./.github/workflows/build-toolchain.yml
    secrets: inherit # pass CACHIX_AUTH_TOKEN (CI environment) to the reusable jobs

  app:
    needs: toolchain
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: toolchain-macos
            build: bash app/packaging/build_app.sh
          - os: windows-2022
            artifact: toolchain-windows
            build: powershell -ExecutionPolicy Bypass -File app/packaging/build_app.ps1
    runs-on: ${{ matrix.os }}
    env:
      # Produce unsigned installers in CI. To ship signed/notarized builds, add the
      # cert secrets (CSC_LINK/CSC_KEY_PASSWORD, and APPLE_ID/APPLE_APP_SPECIFIC_
      # PASSWORD/APPLE_TEAM_ID for notarization) and flip this to true.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Fetch toolchain bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: app/toolchain

      - name: Stamp base image tag
        shell: bash
        run: echo "BASE_IMAGE_TAG=${{ github.event.release.tag_name || 'latest' }}" >> "$GITHUB_ENV"

      - name: Build app
        run: ${{ matrix.build }}

      # Always upload the installers so a manual (workflow_dispatch) run is
      # downloadable from the run's Artifacts, not just release runs.
      - name: Upload installers (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td-deploy-studio-${{ matrix.os }}
          path: |
            app/electron/dist/*.dmg
            app/electron/dist/*.exe
          if-no-files-found: warn

      - name: Attach installers to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/electron/dist/*.dmg
            app/electron/dist/*.exe
