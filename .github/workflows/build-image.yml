# Build the Raspberry Pi base image and publish it to a GitHub Release.
#
# The desktop app never builds the image — it downloads the .img published here
# (deploy_engine/download.py resolves it by release tag). Runs on a native arm64
# Linux runner so the aarch64 NixOS sdImage builds without QEMU/cross.
#
# The sbc-deploy image target emits a COMPRESSED .img.zst; the app's flasher writes
# a raw .img, so we decompress before publishing and attach a .sha256 the app
# verifies against.
name: build-image

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the image to'
        required: true

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm # native aarch64 -> no cross/QEMU
    environment: CI # provides CACHIX_AUTH_TOKEN
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            system-features = kvm big-parallel nixos-test

      # Cachix (fugstudio): the Pi image's NixOS closure (mesa/LLVM/glibc) dwarfs
      # GitHub's 10 GB actions cache that magic-nix-cache is backed by, so use
      # Cachix like build-toolchain — it substitutes prior builds and pushes new
      # ones, and shares the store paths already cached by the toolchain jobs.
      - uses: cachix/cachix-action@v15
        with:
          name: fugstudio
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.9.0
        with: { bazelisk-cache: true, disk-cache: true, repository-cache: true }

      - name: Build SD image (no flash)
        id: build
        run: |
          set -euo pipefail
          # image_sd --no-write builds the image and prints "==> Built image: <path>".
          bazel run //deploy:tdplayer_pi3.image_sd -- --no-write 2>&1 | tee build.log
          IMG="$(grep -oE '==> Built image: .*' build.log | tail -n1 | sed 's/==> Built image: //')"
          test -n "$IMG"
          echo "img=$IMG" >> "$GITHUB_OUTPUT"

      - name: Image size breakdown
        # Diagnostic only (never fails the build): report the raw image size and the
        # largest packages in the ACTUAL system closure, so we can see what dominates
        # the image (mesa/LLVM, glibc locale-archive, linux-firmware, nix, …) before
        # trimming. We resolve the NixOS toplevel from the image's deriver and size
        # its closure numerically (Nix's `-h` output doesn't sort, and `--all` would
        # include Bazel/Nix build tooling that never lands in the image).
        run: |
          set -uo pipefail
          IMG="${{ steps.build.outputs.img }}"
          echo "== raw image =="; ls -lh "$IMG" || true
          imgdir="$(cd "$(dirname "$IMG")/.." && pwd)"
          drv="$(nix-store -q --deriver "$imgdir" 2>/dev/null || true)"
          top=""
          if [ -n "$drv" ]; then
            topdrv="$(nix-store -q --references "$drv" 2>/dev/null \
              | grep -E 'nixos-system-.*\.drv$' | head -1)"
            [ -n "$topdrv" ] && top="$(nix-store -q --outputs "$topdrv" 2>/dev/null | head -1)"
          fi
          echo "== toplevel: ${top:-<unresolved>} =="
          if [ -n "$top" ] && [ -e "$top" ]; then
            echo "== total image closure size =="
            nix path-info -S -h "$top" || true
            echo "== 30 largest packages in the image closure =="
            nix path-info -r --json "$top" | python3 .github/scripts/closure_top.py 30 || true
          else
            echo "toplevel unresolved; whole-store proxy (INCLUDES build tooling):"
            nix path-info --all --json | python3 .github/scripts/closure_top.py 40 || true
          fi
        continue-on-error: true

      - name: Compress + checksum
        id: pack
        run: |
          set -euo pipefail
          mkdir -p out
          IMG="${{ steps.build.outputs.img }}"
          NAME="tdplayer-pi3.img.zst"
          # Publish the COMPRESSED image: the raw .img is >2 GiB, over GitHub's
          # release-asset limit. The app decompresses it before flashing
          # (deploy_engine/download.py). Checksum is over the .zst we upload.
          if [[ "$IMG" == *.zst ]]; then
            cp "$IMG" "out/$NAME"
          else
            nix run nixpkgs#zstd -- -T0 -19 -c "$IMG" > "out/$NAME"
          fi
          ( cd out && sha256sum "$NAME" | tee "$NAME.sha256" )
          ls -l out

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      # Same transient release-upload failures as build-app (the .sha256 sidecar hit
      # "Error creating asset temp dir" on v0.2.0 and only landed on a manual re-run),
      # so upload with the CLI and retry rather than failing the whole image build.
      - name: Attach image to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          for f in out/tdplayer-pi3.img.zst out/tdplayer-pi3.img.zst.sha256; do
            for attempt in 1 2 3 4 5; do
              echo "uploading $(basename "$f") (attempt $attempt)"
              if gh release upload "$TAG" "$f" --clobber; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::failed to upload $f after 5 attempts" >&2
                exit 1
              fi
              sleep $((attempt * 30))
            done
          done
