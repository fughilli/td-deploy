# Build the player images and publish them to a GitHub Release:
#   * tdplayer-pi3.img.zst   — Raspberry Pi 3 SD image (native arm64 runner, so
#                              the aarch64 NixOS sdImage builds without QEMU/cross)
#   * tdplayer-amd64.iso.zst — x86_64 mini-PC install USB (sbc-deploy's amd64
#                              family; native x86_64 runner)
#
# The desktop app never builds an image — it downloads the one published here
# for the kind of player being flashed (deploy_engine/download.py resolves it by
# release tag + kind), verifies it against the attached .sha256, decompresses it
# and writes it raw to the SD card / USB stick.
#
# GitHub caps a release asset at 2 GiB. An image that compresses above that is
# published in ordered pieces (<name>.part00, .part01, ...) that the app
# concatenates; the .sha256 is always over the whole .zst.
name: build-image

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the image to'
        required: true

permissions:
  contents: write

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tdplayer-pi3
            runner: ubuntu-24.04-arm # native aarch64 -> no cross/QEMU
            target: //deploy:tdplayer_pi3.image_sd
            ext: img
          - name: tdplayer-amd64
            runner: ubuntu-24.04 # native x86_64
            target: //deploy:tdplayer_amd64.image_installer
            ext: iso
    name: image (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    environment: CI # provides CACHIX_AUTH_TOKEN
    steps:
      # The x86 installer carries a full desktop-GPU Mesa + linux-firmware +
      # Python closure, twice (store + squashfs): make room on the runner.
      - name: Free disk space
        if: matrix.ext == 'iso'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            system-features = kvm big-parallel nixos-test

      # Cachix (fugstudio): the Pi image's NixOS closure (mesa/LLVM/glibc) dwarfs
      # GitHub's 10 GB actions cache that magic-nix-cache is backed by, so use
      # Cachix like build-toolchain — it substitutes prior builds and pushes new
      # ones, and shares the store paths already cached by the toolchain jobs.
      - uses: cachix/cachix-action@v15
        with:
          name: fugstudio
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.9.0
        with: { bazelisk-cache: true, disk-cache: true, repository-cache: true }

      - name: Build image (no flash)
        id: build
        run: |
          set -euo pipefail
          # image_sd / image_installer --no-write builds the image and prints
          # "==> Built image: <path>".
          bazel run ${{ matrix.target }} -- --no-write 2>&1 | tee build.log
          IMG="$(grep -oE '==> Built image: .*' build.log | tail -n1 | sed 's/==> Built image: //')"
          test -n "$IMG"
          echo "img=$IMG" >> "$GITHUB_OUTPUT"

      - name: Image size breakdown
        # Diagnostic only (never fails the build): report the raw image size and the
        # largest packages in the ACTUAL system closure, so we can see what dominates
        # the image (mesa/LLVM, glibc locale-archive, linux-firmware, nix, …) before
        # trimming. We resolve the NixOS toplevel from the image's deriver and size
        # its closure numerically (Nix's `-h` output doesn't sort, and `--all` would
        # include Bazel/Nix build tooling that never lands in the image).
        run: |
          set -uo pipefail
          IMG="${{ steps.build.outputs.img }}"
          echo "== raw image =="; ls -lh "$IMG" || true
          imgdir="$(cd "$(dirname "$IMG")/.." && pwd)"
          drv="$(nix-store -q --deriver "$imgdir" 2>/dev/null || true)"
          top=""
          if [ -n "$drv" ]; then
            topdrv="$(nix-store -q --references "$drv" 2>/dev/null \
              | grep -E 'nixos-system-.*\.drv$' | head -1)"
            [ -n "$topdrv" ] && top="$(nix-store -q --outputs "$topdrv" 2>/dev/null | head -1)"
          fi
          echo "== toplevel: ${top:-<unresolved>} =="
          if [ -n "$top" ] && [ -e "$top" ]; then
            echo "== total image closure size =="
            nix path-info -S -h "$top" || true
            echo "== 30 largest packages in the image closure =="
            nix path-info -r --json "$top" | python3 .github/scripts/closure_top.py 30 || true
          else
            echo "toplevel unresolved; whole-store proxy (INCLUDES build tooling):"
            nix path-info --all --json | python3 .github/scripts/closure_top.py 40 || true
          fi
        continue-on-error: true

      - name: Compress + checksum
        id: pack
        run: |
          set -euo pipefail
          mkdir -p out
          IMG="${{ steps.build.outputs.img }}"
          NAME="${{ matrix.name }}.${{ matrix.ext }}.zst"
          # Publish the COMPRESSED image: the raw image is >2 GiB, over GitHub's
          # release-asset limit. The app decompresses it before flashing
          # (deploy_engine/download.py). Checksum is over the whole .zst.
          if [[ "$IMG" == *.zst ]]; then
            cp "$IMG" "out/$NAME"
          else
            nix run nixpkgs#zstd -- -T0 -19 -c "$IMG" > "out/$NAME"
          fi
          ( cd out && sha256sum "$NAME" | tee "$NAME.sha256" )
          # Still over the asset cap (the x86 installer can be): publish pieces.
          if [ "$(stat -c %s "out/$NAME")" -gt $((1900 * 1024 * 1024)) ]; then
            ( cd out && split -b 1900M -d -a 2 "$NAME" "$NAME.part" && rm "$NAME" )
          fi
          ls -l out

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      # Same transient release-upload failures as build-app (the .sha256 sidecar hit
      # "Error creating asset temp dir" on v0.2.0 and only landed on a manual re-run),
      # so upload with the CLI and retry rather than failing the whole image build.
      - name: Attach image to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          for f in out/${{ matrix.name }}.*; do
            for attempt in 1 2 3 4 5; do
              echo "uploading $(basename "$f") (attempt $attempt)"
              if gh release upload "$TAG" "$f" --clobber; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::failed to upload $f after 5 attempts" >&2
                exit 1
              fi
              sleep $((attempt * 30))
            done
          done
