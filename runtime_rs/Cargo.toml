[package]
name = "toxc-runtime"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "toxc-runtime"
path = "src/main.rs"

[dependencies]
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
glow = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
