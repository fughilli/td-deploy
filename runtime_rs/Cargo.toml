[package]
name = "toxc-runtime"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "toxc-runtime"
path = "src/main.rs"

[dependencies]
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
glow = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fasteval = "0.2.4"

# DRM/KMS HDMI sink (runtime_rs/src/sink.rs) — Linux-only; other hosts use the
# no-op stub so the runtime still builds there (e.g. a macOS `bazel build //...`).
[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.15.0"

[profile.release]
opt-level = 3
